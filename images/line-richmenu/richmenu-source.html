<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>LINE Rich Menu</title>
<!-- LINE 圖文選單原始檔：大型 6 格（2500 × 1686）。改文字後重新匯出 PNG。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&family=EB+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1a17;
    --paper: #faf7f2;
    --paper-warm: #f5f0e8;
    --paper-mid: #ede7da;
    --accent1: #8b6f47;
    --accent2: #c4956a;
    --accent3: #d4a96a;
    --text-main: #2e2b26;
    --text-soft: #8c8278;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2500px; height: 1686px; overflow: hidden; background: var(--paper); }

  .menu {
    width: 2500px;
    height: 1686px;
    display: grid;
    grid-template-columns: 834px 833px 833px;
    grid-template-rows: 843px 843px;
    background: var(--paper-mid); /* 格線顏色 */
    gap: 4px;
  }

  .cell {
    background: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px;
  }
  .cell:nth-child(even) { background: var(--paper-warm); }

  .icon {
    width: 190px;
    height: 190px;
    margin-bottom: 64px;
    stroke: var(--accent1);
    stroke-width: 5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .title {
    font-family: 'Noto Serif TC', serif;
    font-weight: 600;
    font-size: 124px;
    line-height: 1.2;
    letter-spacing: 0.08em;
    color: var(--ink);
    /* 補回最後一字的字距，讓置中不偏 */
    margin-right: -0.08em;
  }

  .sub {
    margin-top: 28px;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 64px;
    letter-spacing: 0.02em;
    color: var(--text-soft);
  }
  .sub.zh {
    font-family: 'Noto Serif TC', serif;
    font-style: normal;
    font-weight: 500;
    font-size: 52px;
    letter-spacing: 0.06em;
  }

  /* 主要行動：預約諮詢 */
  .cell.primary { background: var(--ink); }
  .cell.primary .icon { stroke: var(--accent3); }
  .cell.primary .title { color: var(--accent3); }
  .cell.primary .sub { color: rgba(250, 247, 242, 0.6); }
</style>
</head>
<body>
  <main class="menu">

    <!-- A：預約諮詢 → booking.html -->
    <section class="cell primary">
      <svg class="icon" viewBox="0 0 100 100" aria-hidden="true">
        <rect x="14" y="20" width="72" height="66" rx="6"/>
        <line x1="14" y1="40" x2="86" y2="40"/>
        <line x1="34" y1="12" x2="34" y2="28"/>
        <line x1="66" y1="12" x2="66" y2="28"/>
        <polyline points="36,62 46,72 66,52"/>
      </svg>
      <h2 class="title">預約諮詢</h2>
      <p class="sub">Book a Session</p>
    </section>

    <!-- B：職涯諮詢是什麼 -->
    <section class="cell">
      <svg class="icon" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="38"/>
        <polygon points="50,22 58,50 50,78 42,50"/>
        <circle cx="50" cy="50" r="3"/>
      </svg>
      <h2 class="title">職涯諮詢</h2>
      <p class="sub">Career Counselling</p>
    </section>

    <!-- C：親密關係諮詢是什麼 -->
    <section class="cell">
      <svg class="icon" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="38" cy="50" r="26"/>
        <circle cx="62" cy="50" r="26"/>
      </svg>
      <h2 class="title">親密關係</h2>
      <p class="sub">Relationship</p>
    </section>

    <!-- D：生涯探索活動 -->
    <section class="cell">
      <svg class="icon" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M16 84 C 16 60, 50 66, 50 50 S 84 40, 84 18"/>
        <circle cx="16" cy="84" r="5"/>
        <circle cx="50" cy="50" r="5"/>
        <path d="M84 8 l7 10 h-14 z"/>
      </svg>
      <h2 class="title">探索活動</h2>
      <p class="sub">Workshop</p>
    </section>

    <!-- E：Podcast -->
    <section class="cell">
      <svg class="icon" viewBox="0 0 100 100" aria-hidden="true">
        <rect x="36" y="10" width="28" height="50" rx="14"/>
        <path d="M24 46 a26 26 0 0 0 52 0"/>
        <line x1="50" y1="72" x2="50" y2="88"/>
        <line x1="36" y1="88" x2="64" y2="88"/>
      </svg>
      <h2 class="title">Podcast</h2>
      <p class="sub zh">蛤！人生有什麼意義</p>
    </section>

    <!-- F：所有連結 → links.html -->
    <section class="cell">
      <svg class="icon" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M44 58 a14 14 0 0 1 0-20 l12-12 a14 14 0 0 1 20 20 l-6 6"/>
        <path d="M56 42 a14 14 0 0 1 0 20 l-12 12 a14 14 0 0 1-20-20 l6-6"/>
      </svg>
      <h2 class="title">所有連結</h2>
      <p class="sub">All Links</p>
    </section>

  </main>
</body>
</html>
